# Application
spring.application.name=privacyrisk
server.port=${PORT:8091}

# PostgreSQL Database
# Handle Render's DATABASE_URL which often starts with postgres:// instead of jdbc:postgresql://
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/privacyrisk}
spring.datasource.url=${spring.datasource.url:jdbc:postgresql://localhost:5432/privacyrisk}

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Prabhala@2004}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Validation
spring.mvc.throw-exception-if-no-handler-found=true

