# Application
spring.application.name=privacyrisk
# Fix for "No more pattern data allowed after {*...} or ** pattern element"
spring.mvc.pathmatch.matching-strategy=ant_path_matcher
server.port=${PORT:8091}

# PostgreSQL Database
# Handle Render's DATABASE_URL which often starts with postgres:// instead of jdbc:postgresql://
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/privacyrisk}


spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Prabhala@2004}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Allow non-standard URLs (like postgres://) if the driver supports it, or rely on our manual variable fix
# But crucially, we must ensure the driver is happy.
spring.datasource.driver-class-name=org.postgresql.Driver
# Some drivers might need this to accept postgres:// urls, though normally they strictly want jdbc:
# We will rely on the user having fixed the Env Var to look like jdbc:postgresql://
# BUT, we can try to force the connection string construction if needed.

# Validation
spring.mvc.throw-exception-if-no-handler-found=true

